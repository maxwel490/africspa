<!-- Password Strength Indicator Component -->
<div class="password-strength-indicator mb-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <label class="form-label mb-0">Password Strength</label>
        <span class="badge strength-badge" id="strengthBadge">Weak</span>
    </div>
    <div class="progress" style="height: 8px;">
        <div class="progress-bar strength-bar" id="strengthBar" role="progressbar" style="width: 0%"></div>
    </div>
    <div class="mt-2">
        <small class="text-muted" id="strengthText">Enter a password to see its strength</small>
    </div>
    <div class="mt-2" id="passwordRequirements">
        <h6 class="text-muted small mb-2">Password Requirements:</h6>
        <div class="row g-2">
            <div class="col-12">
                <small class="requirement" id="req-length">
                    <i class="fas fa-times-circle text-danger me-1"></i>
                    At least <span id="minLength">8</span> characters
                </small>
            </div>
            <div class="col-12">
                <small class="requirement" id="req-uppercase">
                    <i class="fas fa-times-circle text-danger me-1"></i>
                    At least <span id="minUppercase">1</span> uppercase letter
                </small>
            </div>
            <div class="col-12">
                <small class="requirement" id="req-lowercase">
                    <i class="fas fa-times-circle text-danger me-1"></i>
                    At least <span id="minLowercase">1</span> lowercase letter
                </small>
            </div>
            <div class="col-12">
                <small class="requirement" id="req-digits">
                    <i class="fas fa-times-circle text-danger me-1"></i>
                    At least <span id="minDigits">1</span> digit
                </small>
            </div>
            <div class="col-12">
                <small class="requirement" id="req-special">
                    <i class="fas fa-times-circle text-danger me-1"></i>
                    At least <span id="minSpecial">1</span> special character
                </small>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.querySelector('input[type="password"]');
    if (!passwordInput) return;
    
    const strengthBar = document.getElementById('strengthBar');
    const strengthBadge = document.getElementById('strengthBadge');
    const strengthText = document.getElementById('strengthText');
    
    // Update requirements display
    document.getElementById('minLength').textContent = '8';
    document.getElementById('minUppercase').textContent = '1';
    document.getElementById('minLowercase').textContent = '1';
    document.getElementById('minDigits').textContent = '1';
    document.getElementById('minSpecial').textContent = '1';
    
    passwordInput.addEventListener('input', function() {
        const password = this.value;
        const strength = checkPasswordStrength(password);
        updateStrengthIndicator(strength);
        updateRequirements(password);
    });
    
    function checkPasswordStrength(password) {
        let score = 0;
        let strength = 'Very Weak';
        
        if (password.length >= 8) score += 20;
        if (password.length >= 12) score += 10;
        if (password.length >= 16) score += 10;
        
        if (/[A-Z]/.test(password)) score += 15;
        if (/[a-z]/.test(password)) score += 15;
        if (/\d/.test(password)) score += 15;
        if (/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(password)) score += 15;
        
        // Penalize common patterns
        if (/(.)\1{2,}/.test(password)) score -= 20; // Repeated chars
        if (/123|abc|qwe/.test(password.toLowerCase())) score -= 15; // Sequential
        
        if (score < 20) strength = 'Very Weak';
        else if (score < 40) strength = 'Weak';
        else if (score < 60) strength = 'Fair';
        else if (score < 80) strength = 'Good';
        else if (score < 90) strength = 'Strong';
        else strength = 'Very Strong';
        
        return {
            score: Math.max(0, Math.min(100, score)),
            strength: strength,
            errors: []
        };
    }
    
    function updateStrengthIndicator(strength) {
        strengthBar.style.width = strength.score + '%';
        strengthBadge.textContent = strength.strength;
        strengthText.textContent = `Password strength: ${strength.strength} (${strength.score}/100)`;
        
        // Update colors
        strengthBar.className = 'progress-bar strength-bar';
        strengthBadge.className = 'badge strength-badge';
        
        if (strength.score < 20) {
            strengthBar.classList.add('bg-danger');
            strengthBadge.classList.add('bg-danger');
        } else if (strength.score < 40) {
            strengthBar.classList.add('bg-warning');
            strengthBadge.classList.add('bg-warning');
        } else if (strength.score < 60) {
            strengthBar.classList.add('bg-info');
            strengthBadge.classList.add('bg-info');
        } else if (strength.score < 80) {
            strengthBar.classList.add('bg-primary');
            strengthBadge.classList.add('bg-primary');
        } else {
            strengthBar.classList.add('bg-success');
            strengthBadge.classList.add('bg-success');
        }
    }
    
    function updateRequirements(password) {
        const requirements = {
            length: password.length >= 8,
            uppercase: /[A-Z]/.test(password),
            lowercase: /[a-z]/.test(password),
            digits: /\d/.test(password),
            special: /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(password)
        };
        
        Object.keys(requirements).forEach(req => {
            const element = document.getElementById('req-' + req);
            const icon = element.querySelector('i');
            
            if (requirements[req]) {
                icon.className = 'fas fa-check-circle text-success me-1';
                element.classList.add('text-success');
                element.classList.remove('text-muted');
            } else {
                icon.className = 'fas fa-times-circle text-danger me-1';
                element.classList.remove('text-success');
                element.classList.add('text-muted');
            }
        });
    }
});
</script>
