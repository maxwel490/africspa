{% extends "accountant/accountant_base.html" %}

{% block accountant_content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-warning text-dark py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-shield-lock-fill me-2"></i>Update Password</h5>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-info py-2 small">
                        <i class="bi bi-info-circle me-2"></i> Updating password for <strong>{{ staff.username }}</strong>.
                    </div>
                    
                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label small fw-bold">New Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter new password" required minlength="6">
                            <div class="form-text text-xs">Recommended: Use at least 8 characters.</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('accountant.manage_staff') }}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-warning px-4 fw-bold">Update Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
