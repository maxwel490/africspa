{% extends "base.html" %}

{% block title %}Reset Password - Beauty Space{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">Salonist Password Reset</h4>
                <small class="text-secondary">Use staff details registered by your branch accountant</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-uppercase small">Username or Email</label>
                        <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username or email" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-uppercase small">Registered Phone Number</label>
                        <input type="text" name="phone" class="form-control form-control-lg" placeholder="Enter phone used on your account" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-uppercase small">National ID Number</label>
                        <input type="text" name="id_number" class="form-control form-control-lg" placeholder="Enter your registered ID number" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-uppercase small">New Password</label>
                        <input type="password" name="new_password" class="form-control form-control-lg" placeholder="Minimum 8 characters" minlength="8" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-uppercase small">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control form-control-lg" placeholder="Re-enter password" minlength="8" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark btn-lg shadow-sm">Reset Password</button>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
